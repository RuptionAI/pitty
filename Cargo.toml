[package]
name = "pitty"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
description = "A local control layer for AI agents: approve the exact edit or command, then keep a record"
license = "MIT"
readme = "README.md"
repository = "https://github.com/RuptionAI/pitty"
homepage = "https://pitty.tech"
exclude = [".env", ".env.*", "API_USAGE.md"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

pitty-ui = { path = "crates/pitty" }
serde = { version = "1", features = ["derive"] }
pitty-core = { path = "crates/core" }
leanrust = { path = "crates/leanrust" }

[profile.release]
strip = true
lto = "thin"

[workspace]
members = [
    "crates/core",
    "crates/pitty",
    "crates/leanrust",
    "crates/leanrust-macros",
    "tools/build",
    "tools/release",
]
default-members = ["."]
resolver = "2"
