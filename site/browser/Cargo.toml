[package]
name = "pitty-site-browser"
version = "0.3.0"
description = "Browser behavior for pitty.tech (copy buttons and the review demo), compiled to WebAssembly"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Navigator",
    "Node",
    "NodeList",
    "Range",
    "Selection",
    "Window",
] }
