name: Feature request
description: Suggest a new capability or a change to how Pitty works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and where Pitty gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Pitty do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
